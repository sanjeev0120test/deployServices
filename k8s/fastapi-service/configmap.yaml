apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-service-config
  namespace: deploy-services
  labels:
    app: fastapi-service
data:
  PORT: "8000"
  OTEL_SERVICE_NAME: "fastapi-service"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.deploy-services.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_PROPAGATORS: "tracecontext,baggage"
  DEPLOYMENT_ENVIRONMENT: "production"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=deploy-services,service.version=1.0.0,deployment.environment.name=production"
  LOG_LEVEL: "INFO"
